<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base Camp</title>
<style>
  :root {
    --night: #0b1026;
    --deep: #151b3f;
    --ember: #ff7a3d;
    --gold: #ffc857;
    --ice: #8fe3ff;
    --text: #eef2ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--night) 0%, var(--deep) 55%, #3a2149 85%, #6b2f4a 100%);
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
  }

  /* Twinkling stars (pure CSS box-shadow trick) */
  .stars, .stars::after {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 2px; height: 2px;
    background: transparent;
    box-shadow:
      5vw 8vh #fff, 12vw 22vh #cfe8ff, 18vw 5vh #fff, 24vw 31vh #ffe9b0,
      31vw 12vh #fff, 38vw 27vh #cfe8ff, 44vw 6vh #fff, 52vw 19vh #fff,
      58vw 34vh #ffe9b0, 63vw 9vh #cfe8ff, 71vw 24vh #fff, 77vw 4vh #fff,
      83vw 29vh #cfe8ff, 89vw 14vh #ffe9b0, 94vw 7vh #fff, 97vw 33vh #fff,
      8vw 38vh #fff, 27vw 17vh #cfe8ff, 49vw 38vh #fff, 66vw 16vh #ffe9b0;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars::after { top: 6vh; left: 3vw; animation-delay: 2s; opacity: .7; }
  @keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }

  /* Slow aurora glow */
  .aurora {
    position: absolute;
    inset: -20% -10% auto -10%;
    height: 70%;
    background:
      radial-gradient(40% 50% at 30% 40%, rgba(143,227,255,.28), transparent 70%),
      radial-gradient(35% 45% at 70% 35%, rgba(120,255,180,.18), transparent 70%);
    filter: blur(30px);
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translateX(-4%) skewX(-3deg); }
    to   { transform: translateX(4%)  skewX(3deg); }
  }

  /* Mountain silhouettes */
  .mountains { position: absolute; bottom: 0; left: 0; width: 100%; height: 42vh; }
  .mountains path { transition: transform .4s; }

  main {
    position: relative;
    z-index: 2;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem 16vh;
  }

  .compass {
    width: 84px; height: 84px;
    margin-bottom: 1.2rem;
    filter: drop-shadow(0 0 14px rgba(255,200,87,.55));
  }
  .needle { transform-origin: 50px 50px; animation: seek 6s ease-in-out infinite; }
  @keyframes seek {
    0%   { transform: rotate(20deg); }
    20%  { transform: rotate(-35deg); }
    45%  { transform: rotate(60deg); }
    70%  { transform: rotate(-10deg); }
    100% { transform: rotate(20deg); }
  }

  h1 {
    font-size: clamp(2.4rem, 8vw, 5rem);
    letter-spacing: .06em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--gold), var(--ember), var(--gold));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% center; } }

  p.tag {
    margin-top: .8rem;
    max-width: 34rem;
    font-size: clamp(1rem, 2.6vw, 1.3rem);
    font-style: italic;
    color: #c9d3ff;
  }

  button {
    margin-top: 2rem;
    padding: .85rem 2rem;
    font: inherit;
    font-size: 1.05rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--night);
    background: linear-gradient(135deg, var(--gold), var(--ember));
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(255,122,61,.6);
    animation: pulse 2.4s infinite;
    transition: transform .15s;
  }
  button:hover { transform: translateY(-2px) scale(1.04); }
  @keyframes pulse {
    70%  { box-shadow: 0 0 0 18px rgba(255,122,61,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,122,61,0); }
  }

  #log {
    margin-top: 1.4rem;
    min-height: 1.6em;
    color: var(--ice);
    font-size: 1.05rem;
  }

  footer {
    position: absolute;
    bottom: .8rem;
    width: 100%;
    text-align: center;
    z-index: 2;
    font-size: .8rem;
    color: rgba(238,242,255,.55);
  }

  /* Game cards */
  .games {
    margin-top: 2.2rem;
    width: 100%;
    max-width: 44rem;
  }
  .games h2 {
    font-size: .85rem;
    font-weight: normal;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--ice);
    opacity: .8;
    margin-bottom: .9rem;
  }
  .cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
    max-width: 21rem;
    padding: 1rem 1.2rem;
    text-align: left;
    text-decoration: none;
    color: var(--text);
    background: rgba(21, 27, 63, .65);
    border: 1px solid rgba(255, 200, 87, .35);
    border-radius: 14px;
    backdrop-filter: blur(6px);
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    border-color: var(--gold);
    box-shadow: 0 8px 28px rgba(255, 122, 61, .3), 0 0 0 1px rgba(255, 200, 87, .4);
    outline: none;
  }
  .card .icon {
    flex: none;
    width: 3.4rem;
    height: 3.4rem;
    display: grid;
    place-items: center;
    font-size: 1.9rem;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255, 200, 87, .35), rgba(11, 16, 38, .8));
    box-shadow: 0 0 14px rgba(255, 200, 87, .35);
  }
  .card .title { display: block; font-size: 1.15rem; letter-spacing: .06em; color: var(--gold); }
  .card .blurb { display: block; margin-top: .2rem; font-size: .9rem; font-style: italic; color: #c9d3ff; }
  .card .go {
    display: block;
    margin-top: .45rem;
    font-size: .75rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ember);
  }

  /* ---------- Campfire scene ---------- */
  body {
    --fire-w: clamp(92px, 11vw, 150px);
    --fire-left: clamp(.8rem, 19vw, 22rem);
    --fire-bottom: 4.8vh;
  }

  .ground {
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 15vh;
    z-index: 1;
    pointer-events: none;
  }

  /* warm light thrown by the fire; clipped so it never adds scroll height */
  .glow-clip {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 1;
    pointer-events: none;
  }
  .glow {
    position: absolute;
    left: calc(var(--fire-left) + var(--fire-w) * .62);
    bottom: calc(var(--fire-bottom) + var(--fire-w) * .28);
    width: min(115vw, 1000px);
    aspect-ratio: 1;
    transform: translate(-50%, 50%);
    background: radial-gradient(circle,
      rgba(255, 150, 70, .40) 0%,
      rgba(255, 110, 50, .17) 22%,
      rgba(255, 90, 40, .05) 42%,
      transparent 60%);
    mix-blend-mode: screen;
  }

  .camp {
    position: absolute;
    left: var(--fire-left);
    bottom: var(--fire-bottom);
    width: var(--fire-w);
    height: 0;
    z-index: 3;
    pointer-events: none;
  }
  .camp svg { display: block; width: 100%; height: auto; overflow: visible; }
  .camp #fire { position: absolute; left: 31%; bottom: 0; width: 62%; }
  .camp .tent {
    position: absolute;
    left: 108%;
    bottom: 0;
    width: 105%;
  }

  .flame { transform-box: fill-box; transform-origin: 50% 100%; }
  .f-outer { animation: sway1 1.1s ease-in-out infinite alternate; }
  .f-mid   { animation: sway2 .8s ease-in-out infinite alternate; }
  .f-inner { animation: sway3 .55s ease-in-out infinite alternate; }
  .f-left  { animation: sway2 .95s ease-in-out infinite alternate-reverse; }
  .f-right { animation: sway1 .7s ease-in-out infinite alternate-reverse; }
  @keyframes sway1 {
    0%   { transform: scale(1, .93) skewX(-2deg); }
    50%  { transform: scale(.95, 1.07) skewX(1.5deg); }
    100% { transform: scale(1.03, .98) skewX(3deg); }
  }
  @keyframes sway2 {
    0%   { transform: scale(.96, 1.05) skewX(2deg); }
    100% { transform: scale(1.04, .9) skewX(-3deg); }
  }
  @keyframes sway3 {
    0%   { transform: scale(1, 1.08); }
    100% { transform: scale(.92, .92); }
  }

  #embers {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 6;
    pointer-events: none;
  }

  @media (max-width: 640px) {
    main { padding-bottom: 26vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="aurora"></div>

  <svg class="mountains" viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 400 L0 260 L140 150 L230 230 L360 90 L470 210 L560 160 L700 280 L820 120 L940 240 L1060 170 L1200 260 L1200 400 Z" fill="#1d1738" opacity=".85"/>
    <path d="M0 400 L0 310 L110 240 L210 300 L340 200 L450 290 L580 230 L720 330 L860 220 L980 300 L1100 250 L1200 320 L1200 400 Z" fill="#0f0b22"/>
  </svg>

  <main>
    <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#ffc857" stroke-width="3"/>
      <circle cx="50" cy="50" r="38" fill="rgba(11,16,38,.7)" stroke="#ffc857" stroke-width="1" opacity=".6"/>
      <text x="50" y="16" text-anchor="middle" fill="#ffc857" font-size="9" font-family="Georgia,serif">N</text>
      <g class="needle">
        <polygon points="50,14 56,50 44,50" fill="#ff7a3d"/>
        <polygon points="50,86 56,50 44,50" fill="#8fe3ff"/>
      </g>
      <circle cx="50" cy="50" r="4" fill="#ffc857"/>
    </svg>

    <h1>Base Camp</h1>
    <p class="tag">The path ahead is unmapped. The gear is packed. The server is, miraculously, answering.</p>

    <button id="go">Begin the Expedition</button>
    <div id="log" aria-live="polite"></div>

    <section class="games" aria-labelledby="games-heading">
      <h2 id="games-heading">Expeditions</h2>
      <div class="cards">
        <a class="card" href="asteroidDoge/">
          <span class="icon" aria-hidden="true">&#128021;</span>
          <span>
            <span class="title">Asteroid Doge</span>
            <span class="blurb">Dodge the rocks. Survive the dark.</span>
            <span class="go">Play &rarr;</span>
          </span>
        </a>
      </div>
    </section>
  </main>

  <svg class="ground" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 150 L0 70 C 150 40, 300 62, 450 52 C 620 40, 760 78, 920 58 C 1040 44, 1130 56, 1200 46 L1200 150 Z" fill="#07050f"/>
    <path d="M0 150 L0 112 C 200 92, 380 120, 600 104 C 820 88, 1000 118, 1200 100 L1200 150 Z" fill="#040309"/>
  </svg>

  <div class="glow-clip" aria-hidden="true"><div class="glow" id="glow"></div></div>

  <div class="camp" aria-hidden="true">
    <!-- tent, lit on the side facing the fire -->
    <svg class="tent" viewBox="0 0 140 110">
      <defs>
        <linearGradient id="tentLit" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#a8552e"/>
          <stop offset="1" stop-color="#2b1a2e"/>
        </linearGradient>
      </defs>
      <polygon points="70,8 8,104 132,104" fill="url(#tentLit)"/>
      <polygon points="70,8 70,104 132,104" fill="#150f22" opacity=".55"/>
      <polygon points="70,40 46,104 94,104" fill="#0a0714"/>
      <line x1="70" y1="8" x2="70" y2="104" stroke="#0a0714" stroke-width="1.5"/>
    </svg>

    <svg viewBox="0 0 120 140" id="fire">
      <defs>
        <linearGradient id="gOuter" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#ff4d1f"/>
          <stop offset="1" stop-color="#ffb347"/>
        </linearGradient>
        <linearGradient id="gMid" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#ff8a2a"/>
          <stop offset="1" stop-color="#ffd25e"/>
        </linearGradient>
      </defs>
      <ellipse cx="60" cy="128" rx="54" ry="9" fill="#000" opacity=".5"/>
      <!-- stone ring (back) -->
      <g fill="#3b3552" stroke="#1d1738" stroke-width="1.2">
        <ellipse cx="22" cy="118" rx="9" ry="6"/><ellipse cx="38" cy="112" rx="8" ry="5"/>
        <ellipse cx="82" cy="112" rx="8" ry="5"/><ellipse cx="98" cy="118" rx="9" ry="6"/>
      </g>
      <!-- logs -->
      <rect x="20" y="106" width="80" height="13" rx="6.5" transform="rotate(-13 60 113)" fill="#4a2f22"/>
      <rect x="20" y="106" width="80" height="13" rx="6.5" transform="rotate(13 60 113)" fill="#38211a"/>
      <ellipse id="coals" cx="60" cy="113" rx="28" ry="7" fill="#ff6a2a" opacity=".6"/>
      <!-- flames -->
      <path class="flame f-left" d="M34 112 C 24 96, 30 82, 38 70 C 42 84, 50 90, 50 104 C 50 110, 44 114, 34 112 Z" fill="url(#gOuter)" opacity=".9"/>
      <path class="flame f-right" d="M88 112 C 98 98, 94 84, 84 72 C 80 86, 72 92, 72 104 C 72 110, 78 114, 88 112 Z" fill="url(#gOuter)" opacity=".9"/>
      <path class="flame f-outer" d="M60 14 C 78 48, 96 70, 88 98 C 84 112, 72 116, 60 116 C 48 116, 36 112, 32 98 C 26 70, 48 54, 60 14 Z" fill="url(#gOuter)"/>
      <path class="flame f-mid" d="M60 42 C 72 64, 82 80, 76 98 C 73 108, 67 112, 60 112 C 53 112, 47 108, 44 98 C 38 80, 50 66, 60 42 Z" fill="url(#gMid)"/>
      <path class="flame f-inner" d="M60 74 C 68 86, 70 96, 67 104 C 65 109, 62 110, 60 110 C 58 110, 55 109, 53 104 C 50 96, 52 86, 60 74 Z" fill="#fff3c4"/>
      <!-- stone ring (front) -->
      <g fill="#463f60" stroke="#1d1738" stroke-width="1.2">
        <ellipse cx="14" cy="126" rx="9" ry="6"/><ellipse cx="32" cy="127" rx="8" ry="5"/>
        <ellipse cx="50" cy="128" rx="7" ry="4.5"/><ellipse cx="70" cy="128" rx="7" ry="4.5"/>
        <ellipse cx="88" cy="127" rx="8" ry="5"/><ellipse cx="106" cy="126" rx="9" ry="6"/>
      </g>
    </svg>
  </div>

  <canvas id="embers" aria-hidden="true"></canvas>

  <footer>Test site &middot; if you can read this, the trail is open.</footer>

<script>
  const messages = [
    "Provisions checked. Rope: plenty.",
    "Summit spotted on the horizon.",
    "A hidden pass reveals itself...",
    "The wind shifts. Onward!",
    "You found a flag. Plant it."
  ];
  let i = 0;
  document.getElementById("go").addEventListener("click", () => {
    document.getElementById("log").textContent = messages[i++ % messages.length];
  });
</script>

<script>
/* Campfire: flickering firelight plus drifting embers.
   Embers rise from the flame, wobble in a slow wind, and cross over the legend. */
(() => {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('embers');
  const ctx = canvas.getContext('2d');
  const fire = document.getElementById('fire');
  const glow = document.getElementById('glow');
  const coals = document.getElementById('coals');
  let W = 0, H = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // pre-rendered soft sprites: "hot" (bright) and "cool" (dim red) so embers cool as they age
  function sprite(stops) {
    const c = document.createElement('canvas');
    c.width = c.height = 32;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    stops.forEach(([o, col]) => gr.addColorStop(o, col));
    g.fillStyle = gr;
    g.fillRect(0, 0, 32, 32);
    return c;
  }
  const hot = sprite([[0, 'rgba(255,244,205,1)'], [.25, 'rgba(255,196,96,.95)'], [.6, 'rgba(255,120,45,.4)'], [1, 'rgba(255,90,25,0)']]);
  const cool = sprite([[0, 'rgba(255,140,70,.9)'], [.4, 'rgba(220,70,30,.5)'], [1, 'rgba(160,40,20,0)']]);

  const rand = (a, b) => a + Math.random() * (b - a);
  let parts = [];
  let acc = 0;

  function spawn(burst) {
    const r = fire.getBoundingClientRect();
    const high = !burst && Math.random() < .14;   // occasional long-lived ember that drifts up over the legend
    parts.push({
      x: r.left + r.width * rand(.4, .6),
      y: r.top + r.height * rand(.12, .3),
      vx: burst ? rand(-70, 90) : rand(-8, 14),
      vy: burst ? -rand(70, 190) : high ? -rand(75, 115) : -rand(32, 105),
      drift: high ? rand(14, 32) : rand(0, 22),
      wob: rand(.6, 1.8),
      amp: rand(8, 26),
      ph: rand(0, 6.28),
      size: rand(5, 13),
      life: burst ? rand(2.2, 4.5) : high ? rand(9, 14) : rand(4.5, 10),
      age: 0
    });
  }

  function frame(now, last) {
    const dt = Math.min(.05, (now - last) / 1000);
    const t = now / 1000;
    const flick = .86 + .14 * ((Math.sin(t * 9.1) + Math.sin(t * 14.7 + 1.3) + Math.sin(t * 5.3 + 2.1)) / 3);
    glow.style.opacity = flick.toFixed(3);
    coals.style.opacity = (.45 + .3 * flick).toFixed(3);

    acc += dt * 5 * (.7 + .6 * flick);
    while (acc >= 1 && parts.length < 150) { spawn(false); acc -= 1; }
    acc = Math.min(acc, 1);

    const wind = 18 + 26 * Math.sin(t * .13) + 8 * Math.sin(t * .47 + 1);
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    parts = parts.filter(p => {
      p.age += dt;
      if (p.age >= p.life) return false;
      p.x += (p.vx + p.drift + wind + Math.sin(p.age * p.wob * 2 + p.ph) * p.amp) * dt;
      p.y += p.vy * dt;
      p.vy *= (1 - .06 * dt);
      const k = p.age / p.life;
      const a = Math.min(1, p.age / .35) * Math.pow(1 - k, 1.3) * (.7 + .3 * Math.sin(p.age * 17 + p.ph));
      const s = p.size * (1 - .6 * k);
      ctx.globalAlpha = a * .85;
      ctx.drawImage(cool, p.x - s / 2, p.y - s / 2, s, s);
      ctx.globalAlpha = a * Math.max(0, 1 - k * 1.7);
      ctx.drawImage(hot, p.x - s / 2, p.y - s / 2, s, s);
      return true;
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(n => frame(n, now));
  }

  if (!reduce) requestAnimationFrame(n => frame(n, n));

  // the expedition button throws a burst of sparks
  document.getElementById('go').addEventListener('click', () => {
    if (reduce) return;
    for (let i = 0; i < 45 && parts.length < 220; i++) spawn(true);
  });
})();
</script>
</body>
</html>
